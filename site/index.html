<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#275a46" />
    <meta
      name="description"
      content="Тетрадь 7 — бесплатный тренажёр по алгебре, геометрии, вероятности и статистике. 128 тем, 6144 варианта задач, включая сложные комплексные задания, теория и понятная проверка ответов."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Тетрадь 7 · Математика по полочкам</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./assets/css/fonts.css" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script src="./config.js"></script>
    <script type="module" src="./assets/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <div id="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Главная навигация"></aside>
      <button
        id="sidebar-overlay"
        class="sidebar-overlay"
        aria-label="Закрыть меню"
        hidden
      ></button>
      <div class="workspace">
        <header id="topbar" class="topbar"></header>
        <main id="main" class="main" tabindex="-1" aria-label="Содержимое тренажёра">
          <div class="loading-state">
            <span class="loading-pencil">✎</span>
            <h1>Открываем тетрадь…</h1>
            <p>Сейчас появятся уроки и задания.</p>
          </div>
        </main>
        <footer class="footer">
          <span>Тетрадь 7 <span class="footer-dot">·</span> учиться — значит пробовать</span
          ><span
            ><a href="#/program">Программа и источники</a><span class="footer-dot">·</span
            ><a href="#/privacy">О данных</a></span
          >
        </footer>
      </div>
    </div>
    <dialog id="modal" class="modal" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      ><div class="no-js">
        <h1>Нужно включить JavaScript</h1>
        <p>
          Тренажёр проверяет ответы прямо в браузере. Разреши JavaScript и перезагрузи страницу.
          Никаких аккаунтов и платных подписок не нужно.
        </p>
      </div></noscript
    >
  </body>
</html>
